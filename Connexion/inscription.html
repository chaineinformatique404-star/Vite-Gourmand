<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Créez votre compte Vite & Gourmand.">
    <title>Inscription | Vite & Gourmand</title>
    <style>
        :root {
            --vert-principal:#0d4f40;
            --vert-fonce:#083b30;
            --or:#c88a2d;
            --or-fonce:#b47a24;
            --beige:#f8f5ef;
            --blanc:#fff;
            --texte:#202725;
            --gris:#666;
            --bordure:#e6e1d8;
            --erreur:#c33c26;
        }

        * { box-sizing:border-box; margin:0; padding:0; }

        body {
            min-height:100vh;
            font-family:Arial, sans-serif;
            color:var(--texte);
            background:var(--beige);
        }

        a { color:var(--or-fonce); text-decoration:none; }
        a:hover { text-decoration:underline; }

        .page {
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px 16px;
        }

        .card {
            width:100%;
            max-width:520px;
            padding:40px 40px 34px;
            border:1px solid var(--bordure);
            border-radius:10px;
            background:var(--blanc);
            box-shadow:0 2px 12px rgba(0,0,0,.06);
        }

        .brand {
            margin-bottom:24px;
            text-align:center;
            font-family:Georgia, serif;
            font-size:28px;
            font-weight:700;
            color:var(--vert-fonce);
        }
        .brand span { color:var(--or); }

        h1 {
            margin-bottom:8px;
            color:var(--vert-principal);
            font-family:Georgia, serif;
            font-size:26px;
            font-weight:700;
            text-align:center;
        }

        .subtitle {
            margin-bottom:28px;
            color:var(--gris);
            font-size:14px;
            text-align:center;
            line-height:1.5;
        }

        .form-grid {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px 16px;
        }

        .field { display:flex; flex-direction:column; min-width:0; }
        .field.full { grid-column:1 / -1; }

        label {
            margin-bottom:6px;
            font-size:13px;
            font-weight:600;
        }
        label span { color:var(--erreur); }

        input {
            width:100%;
            min-height:44px;
            padding:10px 14px;
            border:1px solid #d9d4cb;
            border-radius:6px;
            outline:none;
            font-size:14px;
            font-family:inherit;
            color:var(--texte);
            background:var(--blanc);
        }
        input::placeholder { color:#8a8d92; }
        input:focus { border-color:var(--or); box-shadow:0 0 0 3px rgba(200,138,45,.15); }

        .hint {
            margin-top:4px;
            color:var(--gris);
            font-size:12px;
        }

        .checkbox {
            display:flex;
            align-items:flex-start;
            gap:10px;
            margin-top:20px;
            font-size:13px;
            color:var(--gris);
            line-height:1.5;
        }
        .checkbox input { width:auto; min-height:auto; margin-top:3px; accent-color:var(--or); }

        .btn-submit {
            width:100%;
            min-height:48px;
            margin-top:24px;
            border:0;
            border-radius:6px;
            color:var(--blanc);
            background:var(--or);
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            transition:background .2s;
        }
        .btn-submit:hover { background:var(--or-fonce); }

        .login-link {
            margin-top:22px;
            color:var(--gris);
            font-size:14px;
            text-align:center;
        }

        @media (max-width:600px) {
            .card { padding:28px 20px 24px; }
            .form-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>

    <main class="page">
        <div class="card">
            <div class="brand">Vite <span>&amp;</span> Gourmand</div>

            <h1>Créer un compte</h1>
            <p class="subtitle">Remplissez le formulaire pour accéder à vos commandes et à vos devis.</p>

            <form id="inscription-form" novalidate>
                <div class="form-grid">
                    <div class="field">
                        <label for="nom">Nom <span>*</span></label>
                        <input id="nom" name="nom" type="text" autocomplete="family-name" placeholder="Votre nom" required>
                    </div>

                    <div class="field">
                        <label for="prenom">Prénom <span>*</span></label>
                        <input id="prenom" name="prenom" type="text" autocomplete="given-name" placeholder="Votre prénom" required>
                    </div>

                    <div class="field full">
                        <label for="email">Adresse e-mail <span>*</span></label>
                        <input id="email" name="email" type="email" autocomplete="email" placeholder="exemple@mail.com" required>
                    </div>

                    <div class="field full">
                        <label for="telephone">Numéro de téléphone</label>
                        <input id="telephone" name="telephone" type="tel" autocomplete="tel" placeholder="06 12 34 56 78">
                    </div>

                    <div class="field">
                        <label for="password">Mot de passe <span>*</span></label>
                        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="••••••••" required>
                        <small class="hint">8 caractères minimum</small>
                    </div>

                    <div class="field">
                        <label for="password-confirm">Confirmer <span>*</span></label>
                        <input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" placeholder="••••••••" required>
                    </div>
                </div>

                <label class="checkbox">
                    <input type="checkbox" name="cgu" required>
                    <span>J'accepte les conditions générales d'utilisation et la politique de confidentialité.</span>
                </label>

                <button class="btn-submit" type="submit">Créer mon compte</button>
            </form>

            <p class="login-link">Vous avez déjà un compte ? <a href="connexion.html">Se connecter</a></p>
        </div>
    </main>

</body>
</html>
